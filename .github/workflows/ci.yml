name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Evolution Data Server bindings
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gir1.2-ebook-1.2 \
            gir1.2-ecal-2.0 \
            gir1.2-secret-1 \
            python3-gi

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          prune-cache: true

      - name: Install project
        run: uv sync --python /usr/bin/python3 --no-python-downloads --locked --all-groups

      - name: Run unit tests
        run: uv run --no-sync pytest tests
