[project]
name = "eds-mcp"
version = "1.0.0"
description = "MCP server for GNOME Evolution Data Server (EDS)"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "fastmcp",
    "pypdf>=6.21.4",
    "python-docx",
    "openpyxl",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
eds-mcp = "eds_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eds_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = false
