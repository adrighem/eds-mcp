[project]
name = "eds-mcp"
version = "0.1.0"
description = "MCP server for GNOME Evolution Data Server (EDS)"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "fastmcp",
    "pypdf",
    "python-docx",
    "openpyxl",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
eds-mcp = "eds_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eds_mcp"]
